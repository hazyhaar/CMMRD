# ============================================================================
# DBA Cockpit - Nginx Reverse Proxy Configuration
# Architecture B: Nginx + ORDS
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream ORDS (adjust host:port to your ORDS instance)
upstream ords_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name cockpit.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name cockpit.example.com;

    # ====================================================================
    # TLS Configuration (TLS 1.2+1.3, Mozilla Intermediate)
    # ====================================================================
    ssl_certificate     /etc/ssl/certs/cockpit.crt;
    ssl_certificate_key /etc/ssl/private/cockpit.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # DH parameters (generate: openssl dhparam -out /etc/ssl/dhparam.pem 4096)
    ssl_dhparam /etc/ssl/dhparam.pem;

    # ====================================================================
    # Security Headers
    # ====================================================================
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection           "0" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy     "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # ====================================================================
    # General settings
    # ====================================================================
    server_tokens off;
    client_max_body_size 1m;

    # Allowed HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # ====================================================================
    # Static files (served by Nginx, not ORDS)
    # ====================================================================
    root /var/www/cockpit/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location /css/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ====================================================================
    # API proxy to ORDS (only /ords/ paths reach ORDS)
    # ====================================================================
    location /ords/cockpit/api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 100;
        limit_req_status 429;

        proxy_pass         http://ords_backend/ords/cockpit/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;

        # Cache metadata responses (catalog, desk structure)
        # Data responses (TSV) are not cached
        proxy_cache_bypass $http_cache_control;
    }

    # Auth endpoints: stricter rate limit
    location /ords/cockpit/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://ords_backend/ords/cockpit/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }

    # ORDS OAuth2 token endpoint
    location /ords/cockpit/oauth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://ords_backend/ords/cockpit/oauth/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }

    # Block direct access to ORDS admin/metadata
    location /ords/cockpit/_/ {
        deny all;
    }

    # ====================================================================
    # Error pages
    # ====================================================================
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type text/plain;
        return 429 "Rate limit exceeded. Retry later.";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/plain;
        return 502 "Backend unavailable.";
    }
}
