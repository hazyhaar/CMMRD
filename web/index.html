<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBA Cockpit</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/vendor/gridstack-all.min.js" defer></script>
</head>
<body>
    <header id="app-header">
        <div class="header-left">
            <span class="logo">DBA Cockpit</span>
            <span id="desk-name" class="desk-title"></span>
        </div>
        <div class="header-right">
            <button id="btn-catalog" class="btn btn-ghost" title="Widget Catalog">+ Widget</button>
            <button id="btn-new-tab" class="btn btn-ghost" title="Nouvel onglet">+ Onglet</button>
            <span id="user-info" class="user-badge"></span>
        </div>
    </header>

    <nav id="desk-selector">
        <ul id="desk-list"></ul>
    </nav>

    <div id="tab-bar">
        <ul id="tab-list"></ul>
    </div>

    <main id="grid-container">
        <div id="widget-grid" class="grid-stack"></div>
    </main>

    <aside id="catalog-panel" class="panel-hidden">
        <div class="panel-header">
            <h3>Catalogue Widgets</h3>
            <button id="btn-close-catalog" class="btn btn-ghost">X</button>
        </div>
        <div id="catalog-categories"></div>
    </aside>

    <div id="toast-container"></div>

    <!-- Core -->
    <script src="js/core/event-bus.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/api-client.js"></script>
    <script src="js/core/router.js"></script>
    <!-- Data -->
    <script src="js/data/tsv-parser.js"></script>
    <script src="js/data/data-fetcher.js"></script>
    <!-- UI -->
    <script src="js/ui/dom-utils.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/catalog-panel.js"></script>
    <!-- Renderers -->
    <script src="js/renderer/widget-factory.js"></script>
    <script src="js/renderer/grid-renderer.js"></script>
    <script src="js/renderer/kpi-renderer.js"></script>
    <script src="js/renderer/chart-renderer.js"></script>
    <!-- Desk -->
    <script src="js/desk/desk-manager.js"></script>
    <script src="js/desk/tab-manager.js"></script>
    <script src="js/desk/widget-manager.js"></script>
    <!-- App -->
    <script src="js/app.js"></script>
</body>
</html>
